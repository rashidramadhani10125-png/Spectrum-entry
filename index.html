<!DOCTYPE html>
<html>
<head>
  <title>Spectrum Client Registration</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input, button { margin: 5px 0; padding: 8px; width: 250px; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Register Client</h2>
<input id="firstName" placeholder="First Name" required /><br>
<input id="lastName" placeholder="Last Name" required /><br>
<input id="nrc" placeholder="NRC Number" required /><br>
<input id="phone" placeholder="Phone Number" required /><br>
<input id="email" placeholder="Email (optional)" /><br>
<button id = "registerBtn" onclick="registerClient()">Register</button>


<p id ="errorText" style="color: #e74c3c; font-weight: bold; margin-top: 15px; text-align: center; display: none;"></p>

<h2>Registered Clients</h2>
<button onclick="loadClients()">Refresh List</button>

<table>
  <thead>
    <tr id = clientsDetails>
      <th>Name</th>
      <th>NRC</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Date Registered</th>
    </tr>
  </thead>
  <tbody id="clientsTable"></tbody>
</table>

<script>

  const clientsTable = document.getElementById('clientsTable');
  const firstName = document.getElementById('firstName');
  const lastName = document.getElementById('lastName');
  const nrc = document.getElementById('nrc');
  const phone = document.getElementById('phone');
  const email = document.getElementById('email');

  const API = 'http://localhost:3000/api/clients';
    
 function registerClient() {
  const data = {
    firstName: firstName.value.trim(),
    lastName: lastName.value.trim(),
    nrc: nrc.value.trim(),
    phone: phone.value.trim(),
    email: email.value.trim(),
  };

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(responseData => {
      const errorText = document.getElementById('errorText')
    if(responseData.message !== 'Client registered successfully') {
      errorText.innerHTML = "Error: " + responseData.message; 
      errorText.style.display = 'block';
  } 
    else{
      errorText.style.display = 'none';
    }

    loadClients();

    firstName.value = '';
    lastName.value = '';  
    nrc.value = '';
    phone.value = '';
    email.value = '';
   });
  }

function loadClients() {
    fetch(API)
        .then(res => res.json())
        .then(data => {
            let rowsHTML = '';
            data.forEach(c => {
                rowsHTML += `
                    <tr>
                        <td>${c.first_name} ${c.last_name}</td>
                        <td>${c.nrc}</td>
                        <td>${c.phone}</td>
                        <td>${c.email || 'N/A'}</td>
                        <td>${new Date(c.created_at).toLocaleString()}</td>
                    </tr>
                `;
            });

            clientsTable.classList.remove('show');
            clientsTable.innerHTML = rowsHTML;

            setTimeout(() => {
                clientsTable.classList.add('show');
            }, 50); 
        });
}


loadClients();
</script>

</body>
</html>
